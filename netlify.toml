# RozBazaar Admin — Netlify Functions deployment.
#
# IMPORTANT: dragging this folder onto Netlify's "Deploys" drop zone
# only uploads static files — it does NOT read this file and does NOT
# provision the function. Netlify only processes netlify.toml and
# builds the functions/ directory via either:
#
#   (a) a Git-connected site (push this repo, Netlify builds it), or
#   (b) the Netlify CLI:  npx netlify-cli deploy --prod
#
# See README.md for the full walkthrough.

[build]
  publish   = "public"
  functions = "netlify/functions"
  command   = "npm install"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
