<style>
/* RozBazaar Staff — tokens from the RozBazaar design system */
:root{
  --g:#1E8E3E; --g-dk:#14682c; --g-lt:#2FA850; --lime:#7ECB53; --lime-s:#E7F5DD;
  --or:#F2760D; --or-s:#FFE7CE; --navy:#101B30; --yellow:#FFD814; --blue:#2874F0;
  --cream:#FCF8F0; --grey:#F3F2EF; --white:#fff;
  --tx:#16150F; --tx2:#5B564C; --mut:#918B7E; --line:#E9E5DD;
  --red:#C62828; --red-s:#FDE7E7;
  --sh:0 2px 10px rgba(16,27,48,.07); --shl:0 12px 32px rgba(16,27,48,.18);
  --sp:cubic-bezier(.34,1.56,.64,1); --ez:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;
  max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow-x:hidden;
  background:var(--cream);color:var(--tx);font-size:15px;font-weight:600}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}

.rv{opacity:0;transform:translateY(14px);animation:rv .45s var(--ez) forwards}
@keyframes rv{to{opacity:1;transform:none}}
.d1{animation-delay:.04s}.d2{animation-delay:.1s}.d3{animation-delay:.17s}
.d4{animation-delay:.25s}.d5{animation-delay:.33s}.d6{animation-delay:.42s}

.scr{display:none}.scr.on{display:block}
.view{display:none;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}.view.on{display:block}

/* ---------- login ---------- */
#s-login{background:var(--white);min-height:100vh}
.login{padding:72px 24px 24px;display:flex;flex-direction:column}
.wm{display:block}
.wm-lg{width:230px;height:64px;margin:0 auto 34px}
.login h1{font-size:26px;font-weight:800;letter-spacing:-.5px}
.login .sub{color:var(--tx2);font-size:14px;margin:6px 0 22px}
.fld{width:100%;border:1.6px solid var(--line);border-radius:14px;padding:15px 16px;font:inherit;
  font-size:16px;background:var(--white);outline:none;transition:border-color .2s var(--ez)}
.fld:focus{border-color:var(--g)}
.btn{width:100%;margin-top:12px;background:var(--g);color:#fff;border-radius:14px;padding:15px;
  font-size:16px;font-weight:800;box-shadow:0 6px 16px rgba(30,142,62,.28);transition:transform .15s var(--sp)}
.btn:active{transform:scale(.96)}
.btn[disabled]{opacity:.6}
.err{color:var(--red);font-size:13px;min-height:20px;margin-top:12px}

/* ---------- header ---------- */
.hdr{background:linear-gradient(168deg,var(--g-lt) 0%,var(--g-dk) 100%);color:#fff;
  padding:14px 16px 14px;position:sticky;top:0;z-index:40;overflow:hidden}
.hdr::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle at 18% 22%,rgba(255,255,255,.09) 0 22px,transparent 23px),
                   radial-gradient(circle at 72% 62%,rgba(255,255,255,.07) 0 30px,transparent 31px)}
.hdr-row{display:flex;align-items:flex-start;position:relative;z-index:2}
.wm-hdr{width:132px;height:36px;background:#fff;border-radius:10px;padding:3px 7px;margin-bottom:8px}
.hdr-lbl{font-size:13px;color:rgba(255,255,255,.88);font-weight:700}
.hdr-day{font-size:24px;font-weight:800;letter-spacing:-.8px;line-height:1.15}
.hdr-ic{margin-left:auto;display:flex;gap:9px}
.ic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;
  font-size:19px;display:flex;align-items:center;justify-content:center;transition:transform .16s var(--sp)}
.ic:active{transform:scale(.88)}
.ic.spin{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hdr-meta{position:relative;z-index:2;display:flex;align-items:center;gap:8px;margin-top:8px;
  font-size:11.5px;color:rgba(255,255,255,.85);font-weight:700}
.pill-src{background:var(--or);color:#fff;border-radius:20px;padding:3px 9px;font-size:10.5px;
  font-weight:800;letter-spacing:.6px}
.pill-src.live{background:rgba(255,255,255,.22)}

/* ---------- blocks ---------- */
.sec{font-size:18px;font-weight:800;letter-spacing:-.4px;margin:20px 0 10px;display:flex;align-items:baseline;gap:8px}
.sec small{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:0}
.card{background:var(--white);border-radius:18px;box-shadow:var(--sh);padding:14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--white);border-radius:16px;box-shadow:var(--sh);padding:13px 14px}
.tile .n{font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.tile .l{font-size:12px;color:var(--tx2);font-weight:700;margin-top:3px}
.tile.g{background:var(--lime-s)} .tile.g .n{color:var(--g-dk)}
.tile.o{background:var(--or-s)} .tile.o .n{color:#b3540a}
.tile.r{background:var(--red-s)} .tile.r .n{color:var(--red)}

.hero{background:linear-gradient(140deg,#34ac52,#166a2e);color:#fff;border-radius:20px;
  padding:18px 18px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero .deco{position:absolute;right:-10px;bottom:-18px;font-size:92px;opacity:.14}
.hero .l{font-size:13px;font-weight:700;color:rgba(255,255,255,.88)}
.hero .n{font-size:38px;font-weight:800;letter-spacing:-1.4px;line-height:1.1;margin:2px 0 6px}
.hero .s{font-size:13px;font-weight:700;color:rgba(255,255,255,.9)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1.4px solid var(--line);background:#fff;border-radius:10px;
  padding:9px 13px;font-size:13px;font-weight:700;min-height:40px;transition:transform .15s var(--sp)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--lime-s);border-color:var(--g);color:var(--g-dk)}
.chip .c{font-size:11px;color:var(--mut);margin-left:3px}
.chip.on .c{color:var(--g-dk)}
.row-gap{height:10px}

.search{width:100%;border:1.4px solid var(--line);border-radius:12px;background:#fff;
  padding:12px 14px;font:inherit;font-size:14.5px;outline:none;margin:10px 0 2px}
.search:focus{border-color:var(--g)}

/* ---------- order cards ---------- */
.ord{background:var(--white);border-radius:16px;box-shadow:var(--sh);padding:13px 14px;margin-top:10px;
  display:block;width:100%;text-align:left;transition:transform .15s var(--sp)}
.ord:active{transform:scale(.98)}
.ord-top{display:flex;align-items:center;gap:8px}
.ord-code{font-size:14px;font-weight:800}
.ord-slot{font-size:12px;color:var(--tx2);font-weight:700}
.ord-amt{margin-left:auto;font-size:16px;font-weight:800;text-align:right}
.ord-amt small{display:block;font-size:10.5px;color:var(--mut);font-weight:700}
.ord-who{font-size:13.5px;margin-top:6px}
.ord-who b{font-weight:800}
.ord-sub{font-size:12.5px;color:var(--tx2);margin-top:3px}
.ord-items{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px;display:none}
.ord.open .ord-items{display:block}
.it{display:flex;font-size:13px;padding:3px 0}
.it span:last-child{margin-left:auto;font-weight:800}
.it.rm{color:var(--mut);text-decoration:line-through}
.ord-foot{display:flex;gap:8px;margin-top:10px}
.call{flex:1;text-align:center;border:1.4px solid var(--line);border-radius:10px;padding:9px;
  font-size:13px;font-weight:800;color:var(--g-dk)}

.st{font-size:10.5px;font-weight:800;border-radius:20px;padding:3px 9px;white-space:nowrap}
.st-new{background:#E4EEFD;color:#1a56c4}
.st-go{background:var(--or-s);color:#b3540a}
.st-ok{background:var(--lime-s);color:var(--g-dk)}
.st-bad{background:var(--red-s);color:var(--red)}
.st-mut{background:var(--grey);color:var(--tx2)}

/* ---------- vendors ---------- */
.ven{background:var(--white);border-radius:18px;box-shadow:var(--sh);padding:14px;margin-top:10px}
.ven-top{display:flex;align-items:center;gap:11px}
.ven-av{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:24px;flex-shrink:0}
.av-vegetable{background:var(--lime-s)} .av-fruit{background:#FDE3EA} .av-onion_potato{background:var(--or-s)}
.ven-name{font-size:15.5px;font-weight:800}
.ven-sub{font-size:12px;color:var(--tx2);margin-top:2px}
.ven-top .st{margin-left:auto}
.ven-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.vs{background:var(--grey);border-radius:12px;padding:9px 10px}
.vs .n{font-size:17px;font-weight:800}
.vs .l{font-size:11px;color:var(--tx2);font-weight:700;margin-top:1px}
.ven-areas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11.5px;font-weight:700;background:var(--cream);border:1px solid var(--line);
  border-radius:8px;padding:4px 8px;color:var(--tx2)}

/* ---------- sale ---------- */
.cat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cat{border-radius:16px;padding:12px 10px;color:#fff;box-shadow:var(--sh);transition:transform .15s var(--sp);text-align:left}
.cat:active{transform:scale(.95)}
.cat .e{font-size:24px}
.cat .n{font-size:17px;font-weight:800;margin-top:6px;letter-spacing:-.4px}
.cat .l{font-size:11.5px;font-weight:700;opacity:.92}
.cat.dim{opacity:.45}
.vc-veg{background:linear-gradient(140deg,#34ac52,#166a2e)}
.vc-onion{background:linear-gradient(140deg,#f5851f,#c1440a)}
.vc-fruit{background:linear-gradient(140deg,#e8546f,#a01f4f)}

.split{display:flex;height:12px;border-radius:8px;overflow:hidden;background:var(--grey);margin:10px 0 8px}
.split i{display:block;height:100%}
.split .cash{background:var(--g)} .split .upi{background:var(--blue)}
.legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--tx2);font-weight:700}
.legend b{color:var(--tx)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}

.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:6px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar i{display:block;width:100%;max-width:34px;background:var(--lime);border-radius:7px 7px 3px 3px;
  min-height:3px;transform-origin:bottom;animation:grow .5s var(--ez) both}
.bar.today i{background:var(--g)}
.bar span{font-size:10px;color:var(--mut);font-weight:700}
.bar em{font-style:normal;font-size:10px;font-weight:800;color:var(--tx2)}
@keyframes grow{from{transform:scaleY(0)}}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;color:var(--mut);font-weight:800;text-align:left;padding:0 0 8px;letter-spacing:.3px}
.tbl td{padding:9px 0;border-top:1px solid var(--line)}
.tbl .num{text-align:right;font-weight:800;white-space:nowrap}
.tbl .qty{text-align:right;color:var(--tx2);white-space:nowrap;padding-right:12px}
.rank{display:inline-flex;width:22px;height:22px;border-radius:7px;background:var(--grey);
  align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-right:8px;color:var(--tx2)}
.note{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.5}

.empty{text-align:center;padding:36px 10px;color:var(--tx2)}
.empty .e{font-size:40px;margin-bottom:8px}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
.sk{background:linear-gradient(90deg,var(--grey),#fff,var(--grey));background-size:200% 100%;
  animation:sk 1.2s linear infinite;border-radius:16px;height:80px;margin-top:10px}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- bottom nav + toast ---------- */
.bn{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:#fff;border-top:1px solid var(--line);display:flex;
  padding:9px 0 calc(9px + env(safe-area-inset-bottom));z-index:55;box-shadow:0 -4px 22px rgba(16,27,48,.06)}
.bni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);
  font-size:11px;font-weight:800;min-height:44px}
.bni .bi{font-size:21px;transition:transform .2s var(--sp)}
.bni.on{color:var(--g)} .bni.on .bi{transform:translateY(-2px) scale(1.12)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(18px);
  background:var(--navy);color:#fff;padding:11px 20px;border-radius:30px;font-size:14px;
  font-weight:700;opacity:0;transition:all .3s var(--sp);z-index:200;pointer-events:none;box-shadow:var(--shl)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){
  .rv,.bar i{animation:none;opacity:1;transform:none}
  *{transition:none!important}
}
</style>
</head>

let ME = null;

let D = null;              /* snapshot */
let TAB = 'orders';
const F = { day: 'today', status: 'all', q: '' };   /* order filters */
const S = { period: 'today', cat: 'vegetable' };    /* sale filters */
const OPEN = new Set();    /* expanded order cards */
let busy = false, timer = null;

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rs = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const num = n => Number(n) || 0;
const fmtQty = n => { const v = Math.round(num(n) * 100) / 100; return String(v); };

function addDays(iso, n) {
  const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
const DAYS = ['Ravivaar', 'Somvaar', 'Mangalvaar', 'Budhvaar', 'Guruvaar', 'Shukravaar', 'Shanivaar'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function dayLabel(iso) {
  if (!D) return iso;
  if (iso === D.today) return 'Aaj';
  if (iso === addDays(D.today, 1)) return 'Kal';
  if (iso === addDays(D.today, -1)) return 'Kal (beeta)';
  const d = new Date(iso + 'T00:00:00Z');
  return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`;
}
function longDay(iso) {
  const d = new Date(iso + 'T00:00:00Z');
  return `${DAYS[d.getUTCDay()]}, ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`;
}

const SLOT = { morning: ['🌅', 'Subah 7–11', 0], afternoon: ['☀️', 'Dopahar 12–4', 1], evening: ['🌇', 'Shaam 5–8', 2] };
const TYPE = {
  vegetable:    { e: '🥬', l: 'Sabzi',      cls: 'vc-veg' },
  onion_potato: { e: '🧅', l: 'Pyaaz–Aloo', cls: 'vc-onion' },
  fruit:        { e: '🍎', l: 'Fruits',     cls: 'vc-fruit' }
};
const STATUS = {
  placed:         ['Naya order', 'st-new'],
  on_the_way:     ['Raaste me', 'st-go'],
  reached:        ['Pahunch gaya', 'st-go'],
  bill_final:     ['Bill bheja', 'st-go'],
  bill_approved:  ['Bill approved', 'st-go'],
  paid:           ['Paid', 'st-ok'],
  delivered:      ['Delivered', 'st-ok'],
  completed:      ['Complete', 'st-ok'],
  cancelled:      ['Cancel', 'st-mut'],
  missed:         ['Miss hua', 'st-bad'],
  disputed:       ['Dispute', 'st-bad'],
  pending_review: ['Review baaki', 'st-bad']
};
const GROUP = {
  all: null,
  new: ['placed'],
  going: ['on_the_way', 'reached', 'bill_final', 'bill_approved'],
  done: ['paid', 'delivered', 'completed'],
  problem: ['cancelled', 'missed', 'disputed', 'pending_review']
};
const GROUP_LBL = { all: 'Sab', new: 'Naye', going: 'Chal rahe', done: 'Complete', problem: 'Cancel / problem' };

/* A booking counts as a sale once money moved: a payment row exists,
   or the vendor marked it paid / delivered / completed. */
const isSold = b => b.pay_amount != null || ['paid', 'delivered', 'completed'].includes(b.status);
const saleAmt = b => num(b.pay_amount ?? b.final_total ?? b.est_total);
const itemQty = it => num(it.final_qty ?? it.qty);
const itemPrice = it => num(it.final_price ?? it.price_at_booking);

function stPill(s) { const [l, c] = STATUS[s] || [s, 'st-mut']; return `<span class="st ${c}">${esc(l)}</span>`; }

let tT;
function toast(m) {
  const t = $('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 1800);
}

async function rpc(fn) {
  try {
    const { data, error } = await sb.rpc(fn);
    if (error) return { ok: false, error: error.message };
    return data && typeof data === 'object' ? { ok: !!data.ok, data: data.data, error: data.msg } : { ok: false, error: 'Galat jawab' };
  } catch (e) { return { ok: false, error: 'Internet check karo' }; }
}

/* ---------- auth ---------- */
function showLogin(msg) {
  clearInterval(timer); timer = null;
  $('s-app').classList.remove('on'); $('s-login').classList.add('on');
  $('loginMsg').textContent = msg || '';
  setTimeout(() => $('pw').focus(), 50);
}
function showApp() {
  $('s-login').classList.remove('on'); $('s-app').classList.add('on');
  render(); refresh();
  clearInterval(timer);
  timer = setInterval(() => { if (!document.hidden) refresh(true); }, 60_000);
}
async function login() {
  const email = $('em').value.trim(), pw = $('pw').value;
  if (!email || !pw) { $('loginMsg').textContent = 'Email aur password dono daalo'; return; }
  $('loginBtn').disabled = true; $('loginMsg').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error) {
    $('loginBtn').disabled = false;
    $('loginMsg').textContent = /invalid/i.test(error.message) ? 'Email ya password galat hai' : error.message;
    return;
  }
  const me = await rpc('staff_me');
  $('loginBtn').disabled = false;
  if (!me.ok) { await sb.auth.signOut(); $('loginMsg').textContent = me.error || 'Ye account staff ka nahi hai'; return; }
  $('pw').value = '';
  ME = me.data; showApp();
}
async function logout() {
  await sb.auth.signOut();
  D = null; ME = null; showLogin('Logout ho gaye');
}

/* ---------- data ---------- */
async function refresh(silent) {
  if (busy) return;
  busy = true;
  const btn = document.querySelector('[data-act="refresh"]');
  btn && btn.classList.add('spin');
  const r = await rpc('staff_snapshot');
  btn && btn.classList.remove('spin');
  busy = false;
  if (!r.ok) {
    if (!$('s-app').classList.contains('on')) return;
    if (/jwt|auth|staff/i.test(r.error || '')) { showLogin('Dubara login karo'); return; }
    if (!silent) toast('Data load nahi hua');
    if (!D) $('v-' + TAB).innerHTML = `<div class="empty"><div class="e">⚠️</div><b>Data load nahi hua</b>
      <p>${esc(r.error || '')}</p><button class="btn" data-act="refresh">Dubara try karo</button></div>`;
    return;
  }
  const first = !D;
  D = r.data;
  $('hdrDay').textContent = 'Aaj, ' + longDay(D.today);
  $('hdrLbl').textContent = 'Namaste 🙏 ' + (ME && ME.name ? ME.name : 'Team RozBazaar');
  $('stamp').textContent = 'Update: ' + new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  render(first);
  if (!silent && !first) toast('Naya data aa gaya ✓');
}

/* ---------- views ---------- */
function render(animate) {
  const el = $('v-' + TAB);
  if (!D) { el.innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>'; return; }
  ({ orders: vOrders, vendors: vVendors, sale: vSale })[TAB](el, animate);
}
function tab(t) {
  TAB = t;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + t));
  document.querySelectorAll('.bni').forEach(b => b.classList.toggle('on', b.dataset.arg === t));
  window.scrollTo(0, 0);
  render(true);
}

/* Orders ------------------------------------------------------ */
function inDay(b) {
  const t = D.today;
  switch (F.day) {
    case 'today': return b.booking_date === t;
    case 'tomorrow': return b.booking_date === addDays(t, 1);
    case 'week': return b.booking_date >= addDays(t, -6) && b.booking_date <= t;
    case 'upcoming': return b.booking_date > t;
    default: return true;
  }
}
function vOrders(el, animate) {
  const dayRows = D.bookings.filter(inDay);
  const q = F.q.trim().toLowerCase();
  const rows = dayRows
    .filter(b => !GROUP[F.status] || GROUP[F.status].includes(b.status))
    .filter(b => !q || [b.code, b.customer_name, b.customer_phone, b.area, b.vendor_name]
      .some(x => String(x || '').toLowerCase().includes(q)))
    .sort((a, b) => F.day === 'week' || F.day === 'all'
      ? (b.booking_date.localeCompare(a.booking_date) || (SLOT[a.slot]?.[2] ?? 9) - (SLOT[b.slot]?.[2] ?? 9))
      : (a.booking_date.localeCompare(b.booking_date) || (SLOT[a.slot]?.[2] ?? 9) - (SLOT[b.slot]?.[2] ?? 9)));

  const cnt = g => dayRows.filter(b => !GROUP[g] || GROUP[g].includes(b.status)).length;
  const today = D.bookings.filter(b => b.booking_date === D.today);
  const tCnt = g => today.filter(b => GROUP[g].includes(b.status)).length;
  const rv = animate ? 'rv' : '';

  const dayChips = [['today', 'Aaj'], ['tomorrow', 'Kal'], ['upcoming', 'Aane wale'], ['week', 'Pichhle 7 din'], ['all', 'Sab (90 din)']];
  el.innerHTML = `
    <div class="tiles ${rv} d1">
      <div class="tile"><div class="n">${today.length}</div><div class="l">Aaj ke orders</div></div>
      <div class="tile o"><div class="n">${tCnt('new') + tCnt('going')}</div><div class="l">Abhi baaki / chal rahe</div></div>
      <div class="tile g"><div class="n">${tCnt('done')}</div><div class="l">Aaj complete</div></div>
      <div class="tile r"><div class="n">${tCnt('problem')}</div><div class="l">Cancel / problem</div></div>
    </div>

    <div class="sec ${rv} d2">Orders <small>${rows.length} dikh rahe</small></div>
    <div class="chips ${rv} d2">${dayChips.map(([k, l]) =>
      `<button class="chip ${F.day === k ? 'on' : ''}" data-act="day" data-arg="${k}">${l}</button>`).join('')}</div>
    <div class="row-gap"></div>
    <div class="chips ${rv} d3">${Object.keys(GROUP).map(k =>
      `<button class="chip ${F.status === k ? 'on' : ''}" data-act="status" data-arg="${k}">${GROUP_LBL[k]}<span class="c">${cnt(k)}</span></button>`).join('')}</div>
    <input class="search ${rv} d3" id="q" type="search" placeholder="Dhoondo — order code, naam, gaon, vendor" value="${esc(F.q)}">
    <div id="ordList">${rows.length ? rows.map(orderCard).join('') : `
      <div class="empty"><div class="e">📭</div><b>Koi order nahi</b><p>Is filter me abhi kuch nahi hai</p></div>`}</div>`;

  const qi = $('q');
  qi.oninput = e => {
    F.q = e.target.value;
    const pos = e.target.selectionStart;
    vOrders(el, false);
    const n = $('q'); n.focus(); n.setSelectionRange(pos, pos);
  };
}
function orderCard(b) {
  const [se, sl] = SLOT[b.slot] || ['', b.slot];
  const t = TYPE[b.v_type] || { e: '🛒', l: b.v_type };
  const final = b.final_total != null || b.pay_amount != null;
  const items = b.items || [];
  const names = items.filter(i => !i.removed).map(i => i.name);
  const open = OPEN.has(b.id);
  return `<div class="ord ${open ? 'open' : ''}" data-act="toggle" data-arg="${esc(b.id)}" role="button" tabindex="0">
    <div class="ord-top">
      <span class="ord-code">${esc(b.code || '—')}</span>${stPill(b.status)}
      <span class="ord-amt">${rs(final ? saleAmt(b) : b.est_total)}<small>${final
        ? (b.pay_method ? (b.pay_method === 'cash' ? 'Cash' : 'UPI') : 'Final bill') : 'Anumaanit'}</small></span>
    </div>
    <div class="ord-slot">${esc(dayLabel(b.booking_date))} · ${se} ${esc(sl)} · ${t.e} ${esc(t.l)}</div>
    <div class="ord-who">👤 <b>${esc(b.customer_name || 'Customer')}</b> · 📍 ${esc(b.area || '—')}</div>
    <div class="ord-sub">🧑‍🌾 ${esc(b.vendor_name || 'Vendor abhi assign nahi')}</div>
    <div class="ord-sub">🧺 ${items.length ? esc(names.slice(0, 4).join(', ')) + (names.length > 4 ? ` +${names.length - 4} aur` : '') : 'Koi item nahi'}</div>
    <div class="ord-items">
      ${items.map(i => `<div class="it ${i.removed ? 'rm' : ''}"><span>${esc(i.name)} · ${fmtQty(itemQty(i))} × ${esc(i.unit || '')}</span>
        <span>${rs(itemQty(i) * itemPrice(i))}</span></div>`).join('')}
      ${b.landmark ? `<div class="ord-sub">Landmark: ${esc(b.landmark)}</div>` : ''}
      <div class="ord-foot">
        ${b.customer_phone ? `<a class="call" href="tel:${esc(b.customer_phone)}">📞 Customer</a>` : ''}
        ${vendorPhone(b.vendor_id) ? `<a class="call" href="tel:${esc(vendorPhone(b.vendor_id))}">📞 Vendor</a>` : ''}
      </div>
    </div>
  </div>`;
}
const vendorPhone = id => (D.vendors.find(v => v.id === id) || {}).phone;

/* Vendors ----------------------------------------------------- */
function vVendors(el, animate) {
  const rv = animate ? 'rv' : '';
  const t = D.today, from7 = addDays(t, -6);
  const stats = v => {
    const mine = D.bookings.filter(b => b.vendor_id === v.id);
    const todayRows = mine.filter(b => b.booking_date === t && b.status !== 'cancelled');
    return {
      today: todayRows.length,
      todaySale: mine.filter(b => b.booking_date === t && isSold(b)).reduce((s, b) => s + saleAmt(b), 0),
      weekSale: mine.filter(b => b.booking_date >= from7 && b.booking_date <= t && isSold(b)).reduce((s, b) => s + saleAmt(b), 0)
    };
  };
  const order = { approved: 0, pending: 1, suspended: 2, rejected: 3 };
  const list = [...D.vendors].sort((a, b) =>
    (order[a.status] ?? 9) - (order[b.status] ?? 9) || String(a.name).localeCompare(String(b.name)));
  const live = list.filter(v => v.status === 'approved' && v.is_active).length;

  el.innerHTML = `
    <div class="tiles ${rv} d1">
      <div class="tile g"><div class="n">${live}</div><div class="l">Live vendors</div></div>
      <div class="tile"><div class="n">${list.length}</div><div class="l">Kul vendors</div></div>
    </div>
    <div class="sec ${rv} d2">Vendors <small>aaj ka kaam aur sale</small></div>
    ${list.length ? list.map((v, i) => {
      const s = stats(v), ty = TYPE[v.v_type] || { e: '🛒', l: v.v_type };
      const st = v.status === 'approved' ? (v.is_active ? ['Live', 'st-ok'] : ['Band hai', 'st-mut'])
        : v.status === 'pending' ? ['Approval baaki', 'st-go'] : [v.status === 'suspended' ? 'Suspended' : 'Rejected', 'st-bad'];
      return `<div class="ven ${rv} d${Math.min(6, i + 2)}">
        <div class="ven-top">
          <div class="ven-av av-${esc(v.v_type)}">${ty.e}</div>
          <div><div class="ven-name">${esc(v.name)}</div>
            <div class="ven-sub">${esc(v.shop_name || ty.l)} · ${v.avg_rating ? '⭐ ' + num(v.avg_rating).toFixed(1) + ` (${num(v.total_ratings)})` : 'Rating nahi'}</div></div>
          <span class="st ${st[1]}">${st[0]}</span>
        </div>
        <div class="ven-stats">
          <div class="vs"><div class="n">${s.today}</div><div class="l">Aaj ke orders</div></div>
          <div class="vs"><div class="n">${rs(s.todaySale)}</div><div class="l">Aaj ki sale</div></div>
          <div class="vs"><div class="n">${rs(s.weekSale)}</div><div class="l">7 din ki sale</div></div>
        </div>
        <div class="ven-areas">${(v.areas_served || []).map(a => `<span class="tag">📍 ${esc(a)}</span>`).join('') || '<span class="tag">Koi gaon nahi</span>'}</div>
        ${v.phone ? `<div class="ord-foot"><a class="call" href="tel:${esc(v.phone)}">📞 ${esc(v.phone)}</a></div>` : ''}
      </div>`;
    }).join('') : '<div class="empty"><div class="e">🧑‍🌾</div><b>Abhi koi vendor nahi</b></div>'}`;
}

/* Sale -------------------------------------------------------- */
function inPeriod(iso) {
  const t = D.today;
  if (iso > t) return false;
  switch (S.period) {
    case 'today': return iso === t;
    case 'yesterday': return iso === addDays(t, -1);
    case '7': return iso >= addDays(t, -6);
    case '30': return iso >= addDays(t, -29);
    default: return iso >= addDays(t, -89);
  }
}
function vSale(el, animate) {
  const rv = animate ? 'rv' : '';
  const sold = D.bookings.filter(b => isSold(b) && inPeriod(b.booking_date));
  const byType = k => sold.filter(b => b.v_type === k);
  const sum = rows => rows.reduce((s, b) => s + saleAmt(b), 0);
  const catRows = byType(S.cat);
  const catTotal = sum(catRows);
  const t = TYPE[S.cat];

  const cash = sum(catRows.filter(b => b.pay_method === 'cash'));
  const upi = sum(catRows.filter(b => b.pay_method && b.pay_method !== 'cash'));
  const other = catTotal - cash - upi;
  const pct = n => catTotal ? (n / catTotal * 100).toFixed(1) : 0;

  /* item-wise, from the final bill lines (qty × per-unit price) */
  const items = {};
  catRows.forEach(b => (b.items || []).forEach(it => {
    if (it.removed) return;
    const k = String(it.name || '').trim().toLowerCase() + '|' + (it.unit || '');
    const r = items[k] || (items[k] = { name: String(it.name || '').trim(), unit: it.unit || '', qty: 0, amt: 0, orders: new Set() });
    r.qty += itemQty(it); r.amt += itemQty(it) * itemPrice(it); r.orders.add(b.id);
  }));
  const itemRows = Object.values(items).sort((a, b) => b.amt - a.amt);

  /* last 7 days, selected type */
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(D.today, -i);
    days.push({ d, v: sum(D.bookings.filter(b => b.v_type === S.cat && isSold(b) && b.booking_date === d)) });
  }
  const max = Math.max(1, ...days.map(x => x.v));

  const periods = [['today', 'Aaj'], ['yesterday', 'Kal'], ['7', '7 din'], ['30', '30 din'], ['90', '90 din']];
  const pLbl = Object.fromEntries(periods)[S.period];
  el.innerHTML = `
    <div class="chips ${rv} d1">${periods.map(([k, l]) =>
      `<button class="chip ${S.period === k ? 'on' : ''}" data-act="period" data-arg="${k}">${l}</button>`).join('')}</div>

    <div class="cat3 ${rv} d2">${Object.entries(TYPE).map(([k, v]) =>
      `<button class="cat ${v.cls} ${S.cat === k ? '' : 'dim'}" data-act="cat" data-arg="${k}">
        <div class="e">${v.e}</div><div class="n">${rs(sum(byType(k)))}</div><div class="l">${v.l}</div></button>`).join('')}</div>

    <div class="hero ${rv} d3" style="margin-top:12px">
      <div class="deco">${t.e}</div>
      <div class="l">${t.l} ki total sale · ${esc(pLbl)}</div>
      <div class="n">${rs(catTotal)}</div>
      <div class="s">${catRows.length} order · average ${rs(catRows.length ? catTotal / catRows.length : 0)} per order</div>
    </div>

    <div class="card ${rv} d4" style="margin-top:12px">
      <div style="font-weight:800">Payment kaise aaya</div>
      <div class="split"><i class="cash" style="width:${pct(cash)}%"></i><i class="upi" style="width:${pct(upi)}%"></i></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--g)"></i>Cash <b>${rs(cash)}</b></span>
        <span><i class="dot" style="background:var(--blue)"></i>UPI <b>${rs(upi)}</b></span>
      </div>
      ${other > 0.5 ? `<div class="note">${rs(other)} ka payment method record nahi hua.</div>` : ''}
    </div>

    <div class="sec ${rv} d5">Pichhle 7 din <small>${t.l}</small></div>
    <div class="card ${rv} d5"><div class="bars">${days.map(x => `
      <div class="bar ${x.d === D.today ? 'today' : ''}">
        <em>${x.v ? (x.v >= 1000 ? (x.v / 1000).toFixed(1) + 'k' : Math.round(x.v)) : ''}</em>
        <i style="height:${(x.v / max * 100).toFixed(1)}%"></i>
        <span>${x.d === D.today ? 'Aaj' : new Date(x.d + 'T00:00:00Z').getUTCDate()}</span></div>`).join('')}
    </div></div>

    <div class="sec ${rv} d6">Kya kitna bika <small>${t.l} · ${esc(pLbl)}</small></div>
    <div class="card ${rv} d6">${itemRows.length ? `
      <table class="tbl"><thead><tr><th>ITEM</th><th class="qty">MAATRA</th><th class="num">SALE</th></tr></thead><tbody>
      ${itemRows.map((r, i) => `<tr><td><span class="rank">${i + 1}</span>${esc(r.name)}</td>
        <td class="qty">${fmtQty(r.qty)} × ${esc(r.unit)}</td><td class="num">${rs(r.amt)}</td></tr>`).join('')}
      </tbody></table>
      <div class="note">Item sale vendor ke final bill se hai (maatra × rate). Total sale me asli payment gina gaya hai, isliye thoda farak ho sakta hai.</div>`
      : `<div class="empty"><div class="e">${t.e}</div><b>Is time me ${esc(t.l.toLowerCase())} ki sale nahi</b><p>Doosra din chuno</p></div>`}
    </div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('a[href^="tel:"]')) return;          /* let calls through, don't toggle the card */
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, arg = el.dataset.arg;
  if (a === 'login') login();
  else if (a === 'logout') logout();
  else if (a === 'refresh') refresh();
  else if (a === 'tab') tab(arg);
  else if (a === 'day') { F.day = arg; render(); }
  else if (a === 'status') { F.status = arg; render(); }
  else if (a === 'period') { S.period = arg; render(); }
  else if (a === 'cat') { S.cat = arg; render(); }
  else if (a === 'toggle') { OPEN.has(arg) ? OPEN.delete(arg) : OPEN.add(arg); el.classList.toggle('open'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'pw' || e.target.id === 'em')) login();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList?.contains('ord')) { e.preventDefault(); e.target.click(); }
});

(async () => {
