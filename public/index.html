<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RozBazaar — Admin</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0F1C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234ADE80'/%3E%3Cstop offset='1' stop-color='%2316A34A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Cpath d='M30 68 Q30 40 55 32 Q68 28 72 40 Q76 55 62 62 Q45 70 30 68Z' fill='%23fff' opacity='0.95'/%3E%3Cpath d='M35 66 Q42 50 58 38' stroke='%2316A34A' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="login">
  <div class="lcard">
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4ADE80"/><stop offset="1" stop-color="#16A34A"/>
      </linearGradient></defs>
      <rect width="100" height="100" rx="24" fill="url(#lg1)"/>
      <path d="M30 68 Q30 40 55 32 Q68 28 72 40 Q76 55 62 62 Q45 70 30 68Z" fill="#fff" opacity="0.95"/>
      <path d="M35 66 Q42 50 58 38" stroke="#16A34A" stroke-width="3" fill="none" stroke-linecap="round"/>
    </svg>
    <div class="disp" style="font-size:24px">RozBazaar Admin</div>
    <p style="font-size:13.5px;color:var(--tx2);margin-top:7px;line-height:1.6">
      Enter the admin password set in <code>.env</code>.</p>
    <input class="fld" id="pw" type="password" placeholder="Admin password" style="margin-top:20px"
           data-enter="login">
    <button class="btn btn-g" style="width:100%;margin-top:12px;padding:14px" data-act="login">Sign in</button>
    <p id="loginMsg" style="font-size:12.5px;color:var(--red);margin-top:14px;min-height:18px"></p>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <aside class="side">
    <div class="brand">
      <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4ADE80"/><stop offset="1" stop-color="#16A34A"/>
        </linearGradient></defs>
        <rect width="100" height="100" rx="24" fill="url(#lg2)"/>
        <path d="M30 68 Q30 40 55 32 Q68 28 72 40 Q76 55 62 62 Q45 70 30 68Z" fill="#fff" opacity="0.95"/>
        <path d="M35 66 Q42 50 58 38" stroke="#16A34A" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
      <div><b>RozBazaar</b><span>ADMIN</span></div></div>
    <button class="nav on" data-v="home"   data-act="go" data-arg="home"><span class="ic">◎</span>Overview</button>
    <button class="nav" data-v="launch"    data-act="go" data-arg="launch"><span class="ic">🚀</span>Launch<span class="badge" id="bLaunch" style="display:none">!</span></button>
    <button class="nav" data-v="bookings"  data-act="go" data-arg="bookings"><span class="ic">📋</span>Bookings</button>
    <button class="nav" data-v="vendors"   data-act="go" data-arg="vendors"><span class="ic">🧑</span>Vendors<span class="badge" id="bVend" style="display:none">0</span></button>
    <button class="nav" data-v="products"  data-act="go" data-arg="products"><span class="ic">🥬</span>Products<span class="badge" id="bProd" style="display:none">0</span></button>
    <button class="nav" data-v="customers" data-act="go" data-arg="customers"><span class="ic">👥</span>Customers</button>
    <button class="nav" data-v="areas"     data-act="go" data-arg="areas"><span class="ic">📍</span>Areas</button>
    <button class="nav" data-v="traffic"   data-act="go" data-arg="traffic"><span class="ic">📈</span>Traffic</button>
    <button class="nav" data-v="messages"  data-act="go" data-arg="messages"><span class="ic">💬</span>Messages<span class="badge" id="bMsg" style="display:none">0</span></button>
    <div class="side-foot">
      <div style="padding:0 8px 10px"><span class="mode" id="modePill">MOCK DATA</span></div>
      <button class="nav" data-act="logout"><span class="ic">⏻</span>Sign out</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1 id="pgTitle">Overview</h1><div class="sub" id="pgSub"></div></div>
      <div class="rt">
        <span class="pill p-m" id="stamp">—</span>
        <button class="btn btn-o btn-sm" data-act="refresh">↻ Refresh</button>
      </div>
    </header>
    <div class="body">
      <div class="scr on" id="v-home"></div>
      <div class="scr" id="v-launch"></div>
      <div class="scr" id="v-bookings"></div>
      <div class="scr" id="v-vendors"></div>
      <div class="scr" id="v-customers"></div>
      <div class="scr" id="v-areas"></div>
      <div class="scr" id="v-products"></div>
      <div class="scr" id="v-traffic"></div>
      <div class="scr" id="v-messages"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
