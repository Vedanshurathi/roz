<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RozBazaar Staff</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E8E3E">
<link rel="icon" href="./logo.png">
<link rel="stylesheet" href="./staff.css">
</head>
<body>

<!-- wordmark, cropped out of the square logo file -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="wordmark" viewBox="26 176 450 124"><image href="./logo.png" width="500" height="500"/></symbol>
</svg>

<section class="scr on" id="s-login">
  <div class="login rv d1">
    <svg class="wm wm-lg" role="img" aria-label="RozBazaar"><use href="#wordmark"/></svg>
    <h1 class="rv d2">Staff login</h1>
    <p class="sub rv d3">Orders, vendors aur aaj ki sale — ek jagah</p>
    <input class="fld rv d4" id="pw" type="password" placeholder="Staff password" autocomplete="current-password">
    <button class="btn rv d5" id="loginBtn" data-act="login">Login karo</button>
    <p class="err" id="loginMsg"></p>
  </div>
</section>

<section class="scr" id="s-app">
  <header class="hdr">
    <div class="hdr-row">
      <div>
        <svg class="wm wm-hdr" role="img" aria-label="RozBazaar"><use href="#wordmark"/></svg>
        <div class="hdr-lbl" id="hdrLbl">Namaste 🙏 Team RozBazaar</div>
        <div class="hdr-day" id="hdrDay">Aaj</div>
      </div>
      <div class="hdr-ic">
        <button class="ic" data-act="refresh" aria-label="Refresh">⟳</button>
        <button class="ic" data-act="logout" aria-label="Logout">⏻</button>
      </div>
    </div>
    <div class="hdr-meta"><span class="pill-src" id="srcPill">…</span><span id="stamp"></span></div>
  </header>

  <main>
    <div class="view on" id="v-orders"></div>
    <div class="view" id="v-vendors"></div>
    <div class="view" id="v-sale"></div>
  </main>

  <nav class="bn">
    <button class="bni on" data-act="tab" data-arg="orders"><span class="bi">📋</span>Orders</button>
    <button class="bni" data-act="tab" data-arg="vendors"><span class="bi">🧑‍🌾</span>Vendors</button>
    <button class="bni" data-act="tab" data-arg="sale"><span class="bi">🥬</span>Sale</button>
  </nav>
</section>

<div class="toast" id="toast"></div>
<script src="./staff.js"></script>
</body>
</html>
