<style>
:root{
  --g:#1E8E3E; --g-dk:#14682c; --g-lt:#2FA850; --lime:#7ECB53; --lime-s:#E7F5DD;
  --or:#F2760D; --or-s:#FFE7CE; --navy:#101B30; --yellow:#FFD814; --blue:#2874F0; --blue-s:#E4EEFD;
  --cream:#FCF8F0; --grey:#F3F2EF; --white:#fff;
  --tx:#16150F; --tx2:#5B564C; --mut:#918B7E; --line:#E9E5DD;
  --red:#C62828; --red-s:#FDE7E7;
  --sh:0 2px 10px rgba(16,27,48,.07); --shl:0 12px 32px rgba(16,27,48,.18);
  --sp:cubic-bezier(.34,1.56,.64,1); --ez:cubic-bezier(.22,1,.36,1);
  --side:248px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--cream)}
body{font-family:-apple-system,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif;color:var(--tx);
  font-size:14.5px;font-weight:600;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.rv{opacity:0;transform:translateY(12px);animation:rv .42s var(--ez) forwards}
@keyframes rv{to{opacity:1;transform:none}}
.d1{animation-delay:.03s}.d2{animation-delay:.08s}.d3{animation-delay:.14s}.d4{animation-delay:.2s}.d5{animation-delay:.27s}.d6{animation-delay:.34s}

/* ---------- login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(circle at 15% 10%,var(--lime-s),transparent 45%),radial-gradient(circle at 90% 90%,var(--or-s),transparent 40%),var(--cream)}
.lcard{width:100%;max-width:400px;background:#fff;border-radius:24px;box-shadow:var(--shl);padding:34px 28px}
.wm{display:block}
.wm-lg{width:220px;height:61px;margin:0 auto 26px}
.lcard h1{font-size:24px;font-weight:800;letter-spacing:-.5px}
.lcard .sub{color:var(--tx2);font-size:13.5px;margin:6px 0 20px}
.fld{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;
  background:#fff;outline:none;transition:border-color .2s var(--ez),box-shadow .2s var(--ez)}
.fld:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(30,142,62,.12)}
.lcard .fld{padding:14px 15px;font-size:16px;margin-bottom:10px}
.err{color:var(--red);font-size:13px;min-height:20px;margin-top:10px}

/* ---------- buttons, pills ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;padding:10px 16px;
  font-weight:800;font-size:13.5px;transition:transform .15s var(--sp),background .2s;white-space:nowrap;min-height:40px}
.btn:active{transform:scale(.95)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-g{background:var(--g);color:#fff;box-shadow:0 4px 12px rgba(30,142,62,.25)} .btn-g:hover{background:var(--g-dk)}
.btn-o{background:#fff;border:1.4px solid var(--line)} .btn-o:hover{border-color:var(--g);color:var(--g-dk)}
.btn-r{background:var(--red-s);color:var(--red)} .btn-r:hover{background:#fbd3d3}
.btn-w{background:var(--or-s);color:#b3540a}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:9px;min-height:32px}
.btn-lg{width:100%;padding:14px;font-size:15.5px;border-radius:13px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;border-radius:20px;padding:3px 9px;white-space:nowrap}
.p-g{background:var(--lime-s);color:var(--g-dk)} .p-o{background:var(--or-s);color:#b3540a}
.p-r{background:var(--red-s);color:var(--red)} .p-b{background:var(--blue-s);color:#1a56c4}
.p-m{background:var(--grey);color:var(--tx2)} .p-y{background:#FFF6C7;color:#7a6400}
.chip{flex-shrink:0;border:1.4px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;
  font-size:12.5px;font-weight:700;transition:transform .15s var(--sp)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--lime-s);border-color:var(--g);color:var(--g-dk)}
.chip .c{color:var(--mut);margin-left:4px;font-size:11px}
.chip.on .c{color:var(--g-dk)}
.chips{display:flex;gap:7px;flex-wrap:wrap}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.side{width:var(--side);background:#fff;border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;
  display:flex;flex-direction:column;padding:18px 14px;z-index:60;transition:transform .3s var(--ez)}
.side .wm-side{width:170px;height:47px;margin:2px 6px 4px}
.side .role{font-size:10.5px;font-weight:800;color:var(--mut);letter-spacing:2.2px;margin:0 8px 18px}
.nav{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border-radius:12px;color:var(--tx2);
  font-size:14px;font-weight:700;margin-bottom:2px;transition:background .15s,color .15s;text-align:left}
.nav:hover{background:var(--grey)}
.nav.on{background:var(--lime-s);color:var(--g-dk)}
.nav .ic{width:22px;text-align:center;font-size:16px}
.nav .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;border-radius:20px;padding:2px 7px}
.nav .badge.o{background:var(--or)}
.side .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
/* the sidebar never squeezes its items (the logo used to shrink to 0 px) and scrolls on short screens */
.side{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.side>*{flex-shrink:0}
@media (max-height:780px){ .side{padding-top:12px;padding-bottom:12px}
  .side .role{margin-bottom:10px} .nav{padding:8px 12px;margin-bottom:1px} }
@media (max-height:640px){ .nav{padding:6px 12px;font-size:13.5px} }
.me{display:flex;align-items:center;gap:10px;padding:8px 10px}
.me .av{width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.me b{display:block;font-size:13px} .me span{font-size:11.5px;color:var(--mut)}
.main{flex:1;margin-left:var(--side);min-width:0}
.top{position:sticky;top:0;z-index:40;background:rgba(252,248,240,.9);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px}
.top h1{font-size:21px;font-weight:800;letter-spacing:-.5px}
.top .sub{font-size:12.5px;color:var(--mut);margin-top:1px}
.top .r{margin-left:auto;display:flex;align-items:center;gap:10px}
.stamp{font-size:11.5px;color:var(--mut);font-weight:700}
.live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--g-dk);background:var(--lime-s);
  border-radius:20px;padding:4px 10px}
.live::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--g);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.burger{display:none;width:40px;height:40px;border-radius:11px;background:#fff;border:1.4px solid var(--line);font-size:18px}
.spin{animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.content{padding:22px 28px 60px;max-width:1320px}
.scr{display:none}.scr.on{display:block}
.scrim{display:none}

/* ---------- blocks ---------- */
.sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.sec h2{font-size:17px;font-weight:800;letter-spacing:-.3px}
.sec .r{font-size:12px;color:var(--mut);font-weight:700}
.sec .act{margin-left:auto}
.card{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:18px;border:1px solid rgba(233,229,221,.6)}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))} .k3{grid-template-columns:repeat(3,minmax(0,1fr))} .k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.kpi .lb{font-size:12px;color:var(--tx2);font-weight:700}
.kpi .nm{font-size:28px;font-weight:800;letter-spacing:-1px;margin:4px 0 2px;line-height:1.1}
.kpi .dt{font-size:12px;color:var(--mut);font-weight:700}
.kpi .ic{float:right;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--grey)}
.kpi.good .ic{background:var(--lime-s)} .kpi.bad .ic{background:var(--red-s)} .kpi.warn .ic{background:var(--or-s)}
.kpi.bad .nm{color:var(--red)} .kpi.warn .nm{color:#b3540a}
.hero{background:linear-gradient(140deg,#34ac52,#166a2e);color:#fff;border-radius:20px;padding:20px 22px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero::after{content:'🥬';position:absolute;right:-8px;bottom:-22px;font-size:110px;opacity:.13}
.hero .lb{font-size:12.5px;font-weight:700;color:rgba(255,255,255,.88)}
.hero .nm{font-size:34px;font-weight:800;letter-spacing:-1.2px;margin:4px 0}
.hero .dt{font-size:12.5px;color:rgba(255,255,255,.9);font-weight:700}
.trend{font-weight:800}.trend.up{color:var(--g-dk)}.trend.down{color:var(--red)}.trend.flat{color:var(--mut)}
.hero .trend{background:rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:2px 8px}
.alert{display:flex;align-items:center;gap:14px;border-radius:16px;padding:14px 16px;margin-bottom:16px;flex-wrap:wrap}
.alert.bad{background:var(--red-s)} .alert.ok{background:var(--lime-s)} .alert.info{background:var(--blue-s)}
.alert .e{font-size:24px} .alert b{display:block;font-size:14.5px} .alert span{font-size:13px;color:var(--tx2)}
.alert>div:not(.ring):not(.e){flex:1;min-width:0}
.alert .btn{margin-left:auto}
.ring{--p:0;width:64px;height:64px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--g) calc(var(--p)*1%),var(--line) 0)}
.ring i{width:50px;height:50px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mu{color:var(--mut);font-size:12px;font-weight:600}
.lbl{display:block;font-size:11.5px;font-weight:800;color:var(--tx2);margin-bottom:5px;letter-spacing:.2px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:200px;position:relative}
.search .fld{padding-left:36px}
.search::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.6}
.tabs{display:flex;gap:4px;background:var(--grey);border-radius:12px;padding:4px;margin-bottom:16px;width:max-content;max-width:100%;overflow-x:auto}
.tab{padding:8px 14px;border-radius:9px;font-size:13px;font-weight:800;color:var(--tx2);white-space:nowrap}
.tab.on{background:#fff;color:var(--tx);box-shadow:var(--sh)}
.tab .c{margin-left:5px;font-size:11px;background:var(--red);color:#fff;border-radius:20px;padding:1px 6px}

/* ---------- tables ---------- */
.tw{background:#fff;border-radius:18px;box-shadow:var(--sh);overflow-x:auto;border:1px solid rgba(233,229,221,.6)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;font-weight:800;color:var(--mut);letter-spacing:.5px;text-transform:uppercase;
  padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FDFBF7}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:#FBF8F1}
td .sub{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
td.num,th.num{text-align:right;white-space:nowrap}
td.acts{white-space:nowrap;text-align:right}
td.acts .btn+.btn{margin-left:6px}
.price-in{width:70px;border:1.4px solid transparent;border-radius:8px;background:var(--grey);padding:5px 7px;font-weight:800;outline:none;text-align:right}
.price-in:focus{border-color:var(--g);background:#fff}

/* ---------- misc widgets ---------- */
.bar-row{margin-bottom:14px}
.bar-row .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.track{height:10px;background:var(--grey);border-radius:8px;overflow:hidden}
.track i{display:block;height:100%;border-radius:8px;animation:grow .7s var(--ez) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.tv{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.tv:first-of-type{border-top:0}
.rank{width:24px;height:24px;border-radius:8px;background:var(--grey);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;color:var(--tx2)}
.tv .n{flex:1;font-weight:700} .tv .v{font-weight:800}
.chk{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk .dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;color:#fff}
.chk.ok .dot{background:var(--g)} .chk.no .dot{background:var(--red)} .chk.wa .dot{background:var(--or)}
.chk b{display:block;font-size:14px} .chk span{font-size:12.5px;color:var(--tx2);line-height:1.5}
.chk .act{margin-left:auto}
.cols{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0}
.col .stack{width:100%;max-width:30px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 3px 3px;overflow:hidden;animation:growY .6s var(--ez) both;transform-origin:bottom}
@keyframes growY{from{transform:scaleY(0)}}
.col .stack i{display:block;width:100%}
.col span{font-size:10px;color:var(--mut);font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--tx2);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.vcard{display:flex;gap:12px;align-items:center}
.av-t{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.av-vegetable{background:var(--lime-s)} .av-fruit{background:#FDE3EA} .av-onion_potato{background:var(--or-s)}
.msg{margin-bottom:12px}
.msg.unread{border-left:4px solid var(--blue)}
.empty{text-align:center;padding:44px 16px;color:var(--tx2)}
.empty .e{font-size:40px;margin-bottom:8px}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
.sk{background:linear-gradient(90deg,var(--grey),#fff,var(--grey));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:16px;height:90px;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}

/* chart */
.chart-wrap{position:relative}
.chart-svg{width:100%;display:block;overflow:visible}
.chart-line{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart-dot{fill:#fff;stroke-width:2;opacity:0}
.chart-axis{font-size:11px;fill:var(--mut);font-weight:700}
.chart-grid{stroke:var(--line);stroke-dasharray:3 4}
.chart-hit{fill:transparent}
.chart-hit:hover+.chart-dot,.chart-wrap:hover .chart-dot{opacity:1}
.chart-tip{position:absolute;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;border-radius:9px;padding:7px 10px;
  transform:translate(-50%,-110%);opacity:0;transition:opacity .15s;white-space:nowrap;z-index:5}
.chart-tip.show{opacity:1}
@keyframes drawIn{to{stroke-dashoffset:0}}
@keyframes popIn{from{opacity:0}to{opacity:1}}

/* ---------- drawer + modal ---------- */
.ov{position:fixed;inset:0;background:rgba(16,27,48,.38);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s var(--ez)}
.ov.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--cream);z-index:95;box-shadow:var(--shl);
  transform:translateX(105%);transition:transform .32s var(--ez);display:flex;flex-direction:column}
.drawer.show{transform:none}
.dr-h{display:flex;align-items:center;gap:10px;padding:16px 18px;background:#fff;border-bottom:1px solid var(--line)}
.dr-h h3{font-size:18px;font-weight:800}
.dr-h .x{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--grey);font-size:16px}
.dr-b{padding:16px 18px 30px;overflow-y:auto;flex:1}
.dr-b .card{margin-bottom:12px;padding:15px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13.5px}
.kv span:first-child{color:var(--tx2)} .kv span:last-child{font-weight:800;text-align:right}
.it{display:flex;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:13.5px}
.it:first-child{border-top:0}
.it .q{color:var(--tx2)} .it .a{margin-left:auto;font-weight:800}
.it.rm{color:var(--mut);text-decoration:line-through}
.steps{display:flex;gap:4px;margin:6px 0 2px}
.steps i{flex:1;height:6px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--g)} .steps.bad i.on{background:var(--red)}
.modal{position:fixed;left:50%;top:50%;width:min(460px,calc(100% - 28px));max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:20px;
  box-shadow:var(--shl);z-index:100;padding:22px;transform:translate(-50%,-46%) scale(.96);opacity:0;pointer-events:none;transition:all .25s var(--sp)}
.modal.show{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.modal h3{font-size:18px;font-weight:800;margin-bottom:4px}
.modal .sub{font-size:13px;color:var(--tx2);margin-bottom:14px;line-height:1.5}
.modal .fgrid{display:grid;gap:10px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(18px);background:var(--navy);color:#fff;padding:11px 20px;
  border-radius:30px;font-size:14px;font-weight:700;opacity:0;transition:all .3s var(--sp);z-index:200;pointer-events:none;box-shadow:var(--shl);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- responsive ---------- */
@media (max-width:1100px){ .k4{grid-template-columns:repeat(2,minmax(0,1fr))} .split{grid-template-columns:1fr} }
@media (max-width:860px){
  .side{transform:translateX(-105%);box-shadow:var(--shl)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(16,27,48,.35);z-index:55}
  .main{margin-left:0}
  .burger{display:inline-flex;align-items:center;justify-content:center}
  .top{padding:12px 16px}
  .top h1{font-size:18px}
  .top .sub,.stamp{display:none}
  .content{padding:16px 14px 50px}
  .k3{grid-template-columns:1fr}
  .kpi .nm{font-size:24px}

}

@media (prefers-reduced-motion:reduce){ .rv,.track i,.col .stack{animation:none;opacity:1;transform:none} *{transition:none!important} }

/* ---------- staff-only ---------- */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lane{background:#fff;border-radius:18px;box-shadow:var(--sh);border:1px solid rgba(233,229,221,.6);display:flex;flex-direction:column;min-height:160px}
.lane-h{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--line)}
.lane-h b{font-size:15px} .lane-h .mu{margin-left:auto}
.lane-b{padding:10px;display:flex;flex-direction:column;gap:8px;max-height:460px;overflow-y:auto}
.oc{border:1.4px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;transition:transform .15s var(--sp),border-color .15s;background:#fff;text-align:left;width:100%}
.oc:hover{border-color:var(--g)} .oc:active{transform:scale(.98)}
.oc .t{display:flex;align-items:center;gap:6px}
.oc .t b{font-size:13.5px} .oc .t .amt{margin-left:auto;font-weight:800}
.oc .s{font-size:12.5px;color:var(--tx2);margin-top:4px;font-weight:600}
.lane .empty{padding:24px 8px}.lane .empty .e{font-size:28px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.vbox{cursor:pointer;transition:transform .15s var(--sp)}
.vbox:active{transform:scale(.98)}
.vstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.vstats div{background:var(--grey);border-radius:12px;padding:8px 10px}
.vstats b{display:block;font-size:15px} .vstats span{font-size:11px;color:var(--tx2);font-weight:700}
.range{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.range input[type=date]{width:auto;padding:8px 10px;font-size:13px}
.cat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cat{border-radius:18px;padding:14px;color:#fff;box-shadow:var(--sh);text-align:left;transition:transform .15s var(--sp),opacity .2s}

.cat .e{font-size:24px} .cat .n{font-size:22px;font-weight:800;letter-spacing:-.6px;margin-top:4px} .cat .l{font-size:12px;font-weight:700;opacity:.92}
.vc-veg{background:linear-gradient(140deg,#34ac52,#166a2e)} .vc-onion{background:linear-gradient(140deg,#f5851f,#c1440a)}
.vc-fruit{background:linear-gradient(140deg,#e8546f,#a01f4f)} .vc-all{background:linear-gradient(140deg,#2b3a55,#101B30)}
.vbars{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:18px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.vbar i{display:block;width:100%;max-width:30px;background:var(--lime);border-radius:6px 6px 3px 3px;min-height:2px;animation:growY .6s var(--ez) both;transform-origin:bottom}
.vbar.today i{background:var(--g)}
.vbar span{font-size:10px;color:var(--mut);font-weight:700}
.vbar em{font-style:normal;font-size:9.5px;font-weight:800;color:var(--tx2);white-space:nowrap}
.acct{max-width:520px}
.bell{animation:ring .8s var(--ez) 2}
@keyframes ring{25%{transform:rotate(14deg)}75%{transform:rotate(-14deg)}}
@media (max-width:1100px){ .board{grid-template-columns:1fr} .lane-b{max-height:none} }
@media (max-width:640px){ .cat3{gap:8px} .cat{padding:11px} .cat .n{font-size:17px} .cat .l{font-size:11px} .vbar em{display:none} }

/* ---------- team: bell, tasks, targets ---------- */
.bell-btn{position:relative;width:40px;height:40px;border-radius:11px;background:#fff;border:1.4px solid var(--line);font-size:17px;
  display:inline-flex;align-items:center;justify-content:center;transition:transform .15s var(--sp)}
.bell-btn:active{transform:scale(.9)}
.nbadge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;
  font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--cream)}
.nrow{padding:12px 14px;margin-bottom:8px;cursor:pointer}
.nrow.unread{border-left:4px solid var(--g);background:#FBFEF8}
.task{padding:15px 16px;margin-bottom:12px;border-left:5px solid var(--line)}
.task.pr-high{border-left-color:var(--red)} .task.pr-normal{border-left-color:var(--or)} .task.pr-low{border-left-color:var(--lime)}
.task.st-done{opacity:.78} .task.st-done .tt{text-decoration:line-through;text-decoration-color:rgba(0,0,0,.25)}
.task .tt{font-size:15.5px;font-weight:800;line-height:1.35}
.task .td{font-size:13.5px;color:var(--tx2);margin-top:6px;line-height:1.55;white-space:pre-wrap}
.task .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.task .note{background:var(--grey);border-radius:10px;padding:8px 10px;font-size:12.5px;color:var(--tx2);margin-top:10px}
.task .acts2{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tgt{padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.tgt .tg-top{display:flex;align-items:flex-start;gap:10px}
.tgt .ttl{font-size:15px;font-weight:800} .tgt .sub{font-size:12.5px;color:var(--tx2);margin-top:2px}
.tgt .big{font-size:28px;font-weight:800;letter-spacing:-1px;margin-top:10px}
.tgt .big small{font-size:14px;color:var(--mut);font-weight:700;letter-spacing:0}
.pbar{height:14px;background:var(--grey);border-radius:10px;overflow:hidden;margin:10px 0 8px;position:relative}
.pbar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--lime),var(--g));animation:grow .9s var(--ez) both;transform-origin:left}
.pbar.behind i{background:linear-gradient(90deg,#f7b267,var(--or))} .pbar.done i{background:linear-gradient(90deg,var(--g),var(--g-dk))}
.pbar .pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--navy);opacity:.55}
.tgt .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.tgt .facts div{background:var(--grey);border-radius:12px;padding:8px 10px}
.tgt .facts b{display:block;font-size:14.5px} .tgt .facts span{font-size:11px;color:var(--tx2);font-weight:700}
.welcome{background:linear-gradient(140deg,#34ac52 0%,#166a2e 70%);color:#fff;border-radius:24px;padding:28px 26px;position:relative;overflow:hidden;box-shadow:var(--shl)}
.welcome::after{content:'🌱';position:absolute;right:-6px;bottom:-28px;font-size:150px;opacity:.14}
.welcome h2{font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1.15;max-width:560px}
.welcome p{font-size:14.5px;color:rgba(255,255,255,.92);margin-top:8px;max-width:560px;line-height:1.55}
.welcome .chipw{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.18);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:800;margin-bottom:12px}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.steps3 .card b{display:block;font-size:14.5px;margin-top:6px} .steps3 .card span{font-size:12.5px;color:var(--tx2)}
.steps3 .n{width:30px;height:30px;border-radius:10px;background:var(--lime-s);color:var(--g-dk);display:flex;align-items:center;justify-content:center;font-weight:800}
.pick{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;border:1.4px solid var(--line);border-radius:12px;padding:8px}
.pick label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;font-size:13.5px;cursor:pointer}
.pick label:hover{background:var(--grey)}
.pick .grp{font-size:10.5px;font-weight:800;color:var(--mut);letter-spacing:.6px;padding:4px 8px 0}
@media (max-width:860px){ .steps3{grid-template-columns:1fr} .tgt .facts{grid-template-columns:repeat(2,minmax(0,1fr))} .welcome h2{font-size:23px} }

@media (max-width:420px){ .top{gap:8px} .top .live{display:none} .top .r{gap:6px} .top .r .btn-sm{padding:6px 9px} .top h1{font-size:16px} }
</style>

<script>
/* ============================================================
   RozBazaar Staff — its own Hostinger website, read-only.
   Login: 10-digit phone + password. Supabase has no SMS provider set
   up, so each employee is an email/password auth user with the address
   <phone>@staff.rozbazaar.shop (see staff_login_email / admin_add_staff).
   Access needs an active row in public.staff (or an admin account).
   Data: staff_me() + staff_snapshot() only — no OTPs, house address or GPS.
   ============================================================ */
'use strict';

const SUPA_URL = 'https://srvpfyjmwaruebbkqkdj.supabase.co';
const SUPA_KEY = 'sb_publishable__x6pa1NvoGWJtntByA8QEw_CfNUP5ZV';   /* public by design */
const sb = window.supabase.createClient(SUPA_URL, SUPA_KEY,
  { auth: { storageKey: 'rb-staff-auth', persistSession: true, autoRefreshToken: true } });
const loginEmail = ph => ph + '@staff.rozbazaar.shop';

let D = null, VIEW = 'today', ME = null, busy = false, timer = null, SEEN = null, NEWCOUNT = 0;
let TASKS = [], TARGETS = [], LOADED = false;
const TEAM_APP = 'staff';
const isIntern = () => ME && ME.kind === 'intern';
/* Interns see the site in plain English (Vedanshu, 27 Sep); sales staff keep the Hinglish. L(hinglish, english) */
const L = (h, e) => isIntern() ? e : h;
const UI = { oq: '', oday: 'today', ostatus: 'all', otype: 'all', oarea: 'all', vq: '', cq: '', csort: 'orders',
  period: 'today', from: '', to: '', cat: 'all' };

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => Number(n) || 0;
const money = n => '₹' + Math.round(num(n)).toLocaleString('en-IN');
const qty = n => String(Math.round(num(n) * 100) / 100);
function addDays(iso, n) { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Ravivaar','Somvaar','Mangalvaar','Budhvaar','Guruvaar','Shukravaar','Shanivaar'];
const dshort = iso => { const d = new Date(iso + 'T00:00:00Z'); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const dlong = iso => { const d = new Date(iso + 'T00:00:00Z'); return `${DAYS[d.getUTCDay()]}, ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
function dayLabel(iso) {
  const t = D.today;
  if (iso === t) return 'Aaj'; if (iso === addDays(t, 1)) return 'Kal'; if (iso === addDays(t, -1)) return 'Kal (beeta)';
  return dshort(iso);
}
const when = d => {
  if (!d) return '—';
  const m = Math.round((Date.now() - new Date(d)) / 60000);
  if (m < 1) return L('abhi', 'just now'); if (m < 60) return m + L(' min pehle', ' min ago');
  if (m < 1440) return Math.round(m / 60) + L(' ghante pehle', ' h ago');
  return Math.round(m / 1440) + L(' din pehle', ' days ago');
};
const SLOT = { morning: ['🌅', 'Subah 7–11', 0], afternoon: ['☀️', 'Dopahar 12–4', 1], evening: ['🌇', 'Shaam 5–8', 2] };
const TYPE = { vegetable: ['🥬', 'Sabzi', 'vc-veg'], onion_potato: ['🧅', 'Pyaaz–Aloo', 'vc-onion'], fruit: ['🍎', 'Fruits', 'vc-fruit'] };
const typeLbl = t => (TYPE[t] || ['🛒', t || '—']).slice(0, 2).join(' ');
const STATUS = {
  placed: ['Naya order', 'p-b'], on_the_way: ['Raaste me', 'p-o'], reached: ['Pahunch gaya', 'p-o'],
  bill_final: ['Bill bheja', 'p-y'], bill_approved: ['Bill approved', 'p-y'], paid: ['Paid', 'p-g'],
  delivered: ['Delivered', 'p-g'], completed: ['Complete', 'p-g'], cancelled: ['Cancel', 'p-m'],
  missed: ['Miss hua', 'p-r'], disputed: ['Dispute', 'p-r'], pending_review: ['Review baaki', 'p-r']
};
const stPill = s => { const [l, c] = STATUS[s] || [s, 'p-m']; return `<span class="pill ${c}">${esc(l)}</span>`; };
const FLOW = ['placed', 'on_the_way', 'reached', 'bill_final', 'bill_approved', 'paid', 'delivered', 'completed'];
const G = { all: null, new: ['placed'], going: ['on_the_way', 'reached', 'bill_final', 'bill_approved'],
  done: ['paid', 'delivered', 'completed'], problem: ['cancelled', 'missed', 'disputed', 'pending_review'] };
const GL = { all: 'Sab', new: 'Naye', going: 'Chal rahe', done: 'Complete', problem: 'Cancel / problem' };
const OPEN = [...G.new, ...G.going];
const isSold = b => b.pay_amount != null || G.done.includes(b.status);
const saleAmt = b => num(b.pay_amount ?? b.final_total ?? b.est_total);
const iq = it => num(it.final_qty ?? it.qty), ip = it => num(it.final_price ?? it.price_at_booking);
const phone10 = p => String(p || '').replace(/\D/g, '').slice(-10);
const callBtns = p => p ? `<a class="btn btn-o btn-sm" href="tel:${esc(p)}">📞 Call</a>
  <a class="btn btn-o btn-sm" href="https://wa.me/91${phone10(p)}" target="_blank" rel="noopener">💬 WhatsApp</a>` : '';

let tT;
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('show'), 2600); }
function beep() {
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.setValueAtTime(.15, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .5); o.start(); o.stop(a.currentTime + .5);
  } catch (e) { /* no sound is fine */ }
}
async function rpc(fn, args) {
  try {
    const { data, error } = await sb.rpc(fn, args || {});
    if (error) return { ok: false, error: error.message, auth: /jwt|staff/i.test(error.message) };
    if (data && typeof data === 'object' && 'ok' in data) return { ok: !!data.ok, data: data.data, error: data.msg, auth: !data.ok && /staff ka nahi/i.test(data.msg || '') };
    return { ok: false, error: L('Galat jawab', 'Unexpected reply') };
  } catch (e) { return { ok: false, error: L('Internet check karo', 'Check your internet') }; }
}

/* ---------- auth ---------- */
function showLogin(msg) {
  clearInterval(timer); timer = null;
  $('app').classList.add('hide'); $('login').classList.remove('hide');
  $('loginMsg').textContent = msg || '';
}
function showApp() {
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('meName').textContent = ME.name || 'Staff'; $('mePhone').textContent = [ME.role, ME.phone].filter(Boolean).join(' · ') || (ME.is_admin ? 'Admin' : '');
  $('meAv').textContent = (ME.name || 'S').trim()[0].toUpperCase();

async function login() {

async function setTask(id, status) {
  let note = null;
  if (status === 'not_done') {
    for (;;) {   /* keep asking until there is a reason or they cancel */
      const v = await modal({ title: L('Kaam kyun nahi ho paya?', 'Why couldn\'t you do it?'), sub: L('Admin ko ye reason dikhega.', 'The admin will see this reason.'),
        ok: L('Admin ko bhejo', 'Send to admin'), danger: true,
        fields: [{ id: 'note', label: L('Reason (zaroori)', 'Reason (required)'), type: 'textarea', ph: L('Jaise: customer ne phone nahi uthaya', 'e.g. the customer did not pick up the phone') }] });
      if (!v) return;
      if (v.note) { note = v.note; break; }
      toast(L('Reason likhna zaroori hai', 'Please write a reason'));
    }
  } else if (status === 'done') {
    const v = await modal({ title: L('Kaam complete? 🎉', 'Task done? 🎉'), sub: L('Admin ko notification jaayega.', 'The admin will be notified.'), ok: L('✓ Complete', '✓ Done'),
      fields: [{ id: 'note', label: L('Kuch batana hai? (optional)', 'Anything to add? (optional)'), type: 'textarea', ph: L('Jaise: 5 dukaan wale se baat ho gayi', 'e.g. spoke to 5 shop owners') }] });
    if (!v) return; note = v.note || null;
  }
  const r = await rpc('staff_set_task_status', { p_task: id, p_status: status, p_note: note });
  toast(r.ok ? (isIntern() ? (status === 'done' ? 'Well done! Task complete ✓' : status === 'not_done' ? 'The admin has been told' : 'Moved back to To do')
               : (r.data && r.data.msg) || (status === 'done' ? 'Shabaash! Kaam complete ✓' : status === 'not_done' ? 'Admin ko bata diya' : 'Wapas baaki me'))

function download(name, rows) {

  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------- sales target card (shared) ---------- */
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5);
const shortD = iso => { const d = new Date(String(iso).slice(0, 10) + 'T00:00:00Z'); return `${d.getUTCDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]}`; };
function targetInfo(t) {
  const today = String(t.today).slice(0, 10), s = String(t.start_date).slice(0, 10), e = String(t.end_date).slice(0, 10);
  const amount = Number(t.amount) || 0, got = Number(t.achieved) || 0;
  const total = daysBetween(s, e) + 1, elapsed = Math.min(total, Math.max(0, daysBetween(s, today) + 1));
  const left = today > e ? 0 : today < s ? total : daysBetween(today, e) + 1;   /* includes today */
  const pct = amount ? got / amount : 0, pace = total ? elapsed / total : 0;
  const state = got >= amount ? 'done' : today > e ? 'missed' : today < s ? 'upcoming' : pct + 0.05 >= pace ? 'ontrack' : 'behind';
  return { today, s, e, amount, got, total, elapsed, left, pct, pace, state, remaining: Math.max(0, amount - got),
    perDay: left ? Math.max(0, amount - got) / left : 0 };
}

    <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><div class="tt" style="flex:1">${esc(t.title)}</div>${`<span class="pill ${TST[t.status][1]}">${tstL(t.status)}</span>`}</div>
    ${t.details ? `<div class="td">${esc(t.details)}</div>` : ''}
    <div class="meta"><span class="pill ${PRI[t.priority][1]}">${priL(t.priority)}</span>${dueChip(t.due_date, t.status, today)}
      ${admin ? `<span class="pill ${t.staff_kind === 'intern' ? 'p-y' : 'p-b'}">👤 ${esc(t.staff_name)} · ${t.staff_kind === 'intern' ? 'Intern' : 'Sales'}</span>` : ''}
      <span class="mu">${L('diya ', 'given ')}${when(t.created_at)}${t.completed_at ? L(' · complete ', ' · done ') + when(t.completed_at) : ''}</span></div>
    ${t.staff_note ? `<div class="note">💬 ${esc(t.staff_note)}</div>` : ''}
    <div class="acts2">${admin
      ? `<button class="btn btn-o btn-sm" data-act="editTask" data-arg="${esc(t.id)}">✏️ Edit</button>
         ${t.status !== 'todo' ? `<button class="btn btn-o btn-sm" data-act="reopenTask" data-arg="${esc(t.id)}">↩️ Dobara kholo</button>` : ''}
         <button class="btn btn-r btn-sm" data-act="delTask" data-arg="${esc(t.id)}">Hatao</button>`
      : t.status === 'todo'
        ? `<button class="btn btn-g" data-act="taskDone" data-arg="${esc(t.id)}">✓ ${L('Complete', 'Done')}</button>
           <button class="btn btn-r" data-act="taskNotDone" data-arg="${esc(t.id)}">✕ ${L('Nahi ho paya', 'Not done')}</button>`
        : `<button class="btn btn-o btn-sm" data-act="taskTodo" data-arg="${esc(t.id)}">↩️ ${L('Wapas baaki me daalo', 'Move back to To do')}</button>`}</div>
  </div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.closest('a[href]')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.arg;
  switch (el.dataset.act) {
    case 'login': login(); break;
    case 'logout': closeAll(); logout(); break;
    case 'refresh': refresh(); break;
    case 'go': closeAll(); go(a); break;
    case 'openNav': document.body.classList.add('nav-open'); break;
    case 'closeNav': document.body.classList.remove('nav-open'); break;
    case 'closeAll': closeAll(); break;
    case 'order': openOrder(a); break;
    case 'vendor': openVendor(a); break;
    case 'customer': openCustomer(a); break;
    case 'notifs': openNotifs(); break;
    case 'readAll': readNotif(null); break;
    case 'readOne': readNotif(a); break;
    case 'pushOn': enablePush(); break;
    case 'tf': UI.tf = a; render(false); break;
    case 'taskDone': setTask(a, 'done'); break;
    case 'taskNotDone': setTask(a, 'not_done'); break;
    case 'taskTodo': setTask(a, 'todo'); break;
    case 'modalOk': modalOk(); break;
    case 'modalCancel': modalCancel(); break;
    case 'saveName': saveName(); break;
    case 'oday': UI.oday = a; render(false); break;
    case 'ostatus': UI.ostatus = a; render(false); break;
    case 'period': UI.period = a; render(false); break;
    case 'cat': UI.cat = a; render(false); break;
    case 'csort': UI.csort = a; render(false); break;
    case 'csvOrders': csvOrders(); break;
    case 'csvSale': csvSale(); break;
    case 'changePw': changePw(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'pw' || e.target.id === 'ph')) login();
  if (e.key === 'Enter' && (e.target.id === 'np2')) changePw();
  if (e.key === 'Enter' && (e.target.id === 'myName')) saveName();
  if (e.key === 'Escape') { if ($('modal').classList.contains('show')) modalCancel(); else closeAll(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && D) refresh(true); });

(async () => {
  const { data } = await sb.auth.getSession();
  if (data && data.session) {
    const me = await rpc('staff_me');
    if (me.ok) { ME = me.data; showApp(); return; }
    await sb.auth.signOut();
  }
  showLogin();
})();
</script>
</body>
